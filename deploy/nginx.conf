# emuman behind nginx with TLS.
# Point emuman at 127.0.0.1:8787 and set EMUMAN_TRUST_PROXY=1 when using a proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name emuman.example.com;

    ssl_certificate     /etc/letsencrypt/live/emuman.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emuman.example.com/privkey.pem;

    client_max_body_size 32g;   # ISO uploads

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
